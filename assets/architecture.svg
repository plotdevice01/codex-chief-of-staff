<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Chief of Staff architecture</title>
  <desc id="desc">Lifecycle hooks combine the public contract and private configuration before scoped work.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B6472"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="32" fill="#F8FAFC"/>
  <text x="60" y="68" fill="#14213D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">A public operating contract. Private authority stays local.</text>
  <text x="60" y="104" fill="#5B6472" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">No server. No telemetry. No mystery account inheritance.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="60" y="160" width="260" height="112" rx="20" fill="#14213D"/>
    <text x="88" y="202" fill="#F8FAFC" font-size="23" font-weight="700">Session starts</text>
    <text x="88" y="235" fill="#B9C2CF" font-size="18">Session + subagent hooks</text>

    <rect x="470" y="138" width="280" height="104" rx="20" fill="#E8F4F1" stroke="#2A9D8F" stroke-width="3"/>
    <text x="500" y="180" fill="#14213D" font-size="22" font-weight="700">Public contract</text>
    <text x="500" y="213" fill="#5B6472" font-size="17">AGENTS.md + persona</text>

    <rect x="470" y="276" width="280" height="104" rx="20" fill="#FFF1E8" stroke="#F4A261" stroke-width="3"/>
    <text x="500" y="318" fill="#14213D" font-size="22" font-weight="700">Private configuration</text>
    <text x="500" y="351" fill="#5B6472" font-size="17">Scopes, identities, policy</text>

    <rect x="888" y="202" width="252" height="128" rx="20" fill="#14213D"/>
    <text x="916" y="245" fill="#F8FAFC" font-size="22" font-weight="700">Scoped execution</text>
    <text x="916" y="279" fill="#B9C2CF" font-size="17">Source order + gates</text>
    <text x="916" y="305" fill="#B9C2CF" font-size="17">Approval + verification</text>

    <path d="M320 216H448" fill="none" stroke="#5B6472" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M750 190H854Q872 190 872 208V246H888" fill="none" stroke="#5B6472" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M750 328H854Q872 328 872 310V286H888" fill="none" stroke="#5B6472" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="60" y="468" width="320" height="142" rx="20" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="2"/>
    <text x="88" y="508" fill="#14213D" font-size="21" font-weight="700">Project instructions</text>
    <text x="88" y="541" fill="#5B6472" font-size="17">Preserved, never flattened</text>
    <text x="88" y="571" fill="#2A9D8F" font-size="17" font-weight="700">Project safety can be stricter</text>

    <rect x="440" y="468" width="320" height="142" rx="20" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="2"/>
    <text x="468" y="508" fill="#14213D" font-size="21" font-weight="700">Approved connectors</text>
    <text x="468" y="541" fill="#5B6472" font-size="17">Live identity checked first</text>
    <text x="468" y="571" fill="#F4A261" font-size="17" font-weight="700">Mismatch means stop</text>

    <rect x="820" y="468" width="320" height="142" rx="20" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="2"/>
    <text x="848" y="508" fill="#14213D" font-size="21" font-weight="700">Verified result</text>
    <text x="848" y="541" fill="#5B6472" font-size="17">Idempotent write</text>
    <text x="848" y="571" fill="#2A9D8F" font-size="17" font-weight="700">Read saved state back</text>

    <path d="M1014 330V420H220V468" fill="none" stroke="#5B6472" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1014 420H600V468" fill="none" stroke="#5B6472" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1014 330V468" fill="none" stroke="#5B6472" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
