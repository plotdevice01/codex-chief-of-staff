name: Bug report
description: Report a reproducible Chief of Staff defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private configuration, client data, or account identifiers.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.4.4
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Codex CLI
        - Codex Desktop
        - Other compatible host
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the smallest reproducible sequence and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, identities, local paths, and client data.
          required: true
