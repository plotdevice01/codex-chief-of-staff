name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install python-docx PyYAML
      - run: python Test-Persona.py
      - run: python validate_install.py --example
      - run: node tests/test_hooks.js
      - run: python tests/test_sync.py
      - run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - run: python scripts/build_release.py --output dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.zip"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --generate-notes --verify-tag
